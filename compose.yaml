name: zerotier-sovereign

services:
  sovereign:
    image: ${SOVEREIGN_IMAGE:-zerotier-sovereign:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOVEREIGN_VERSION: ${SOVEREIGN_VERSION:-0.3.0}
        PLANET_ZEROTIER_VERSION: ${PLANET_ZEROTIER_VERSION:-1.16.2}
        PLANET_ZEROTIER_SOURCE_REF: ${PLANET_ZEROTIER_SOURCE_REF:-1.16.2}
        CONTROLLER_ZEROTIER_VERSION: ${CONTROLLER_ZEROTIER_VERSION:-1.14.2}
        CONTROLLER_ZEROTIER_SOURCE_REF: ${CONTROLLER_ZEROTIER_SOURCE_REF:-1.14.2}
        NODEJS_IMAGE: ${ZTNET_NODE_IMAGE:-node:24-alpine3.24}
    container_name: zerotier-sovereign
    restart: unless-stopped
    environment:
      # PLANET/root
      PLANET_IP_ADDR4: ${PLANET_IP_ADDR4:-}
      PLANET_IP_ADDR6: ${PLANET_IP_ADDR6:-}
      PLANET_ZT_PORT: ${PLANET_ZT_PORT:-9994}
      PLANET_WORLD_TIMESTAMP: ${PLANET_WORLD_TIMESTAMP:-}
      PLANET_FILE_SERVER_PORT: 3001
      PLANET_FILE_KEY: ${PLANET_FILE_KEY:-}

      # Standalone controller
      CONTROLLER_ZT_PORT: ${CONTROLLER_ZT_PORT:-9993}

      # ztncui
      ZTNCUI_PORT: 3000

    ports:
      # Public/reachable PLANET endpoint.
      - "${PLANET_BIND_IP:-0.0.0.0}:${PLANET_ZT_PORT:-9994}:${PLANET_ZT_PORT:-9994}/udp"
      - "${PLANET_BIND_IP:-0.0.0.0}:${PLANET_ZT_PORT:-9994}:${PLANET_ZT_PORT:-9994}/tcp"
      # Controller VL1 traffic. Its HTTP management API is NOT published.
      - "${CONTROLLER_BIND_IP:-0.0.0.0}:${CONTROLLER_ZT_PORT:-9993}:${CONTROLLER_ZT_PORT:-9993}/udp"
      # Management UI and PLANET download service stay loopback-only by default.
      - "${ZTNCUI_BIND_IP:-127.0.0.1}:${ZTNCUI_PORT:-3000}:3000/tcp"
      - "${PLANET_FILE_BIND_IP:-127.0.0.1}:${PLANET_FILE_PORT:-3001}:3001/tcp"
    volumes:
      - ./data/planet:/data/planet
      - ./data/controller:/data/controller
      - ./data/ztncui:/data/ztncui
    stop_grace_period: 30s

