name: Publish Candidate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-candidate-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load pins and image name
        id: vars
        shell: bash
        run: |
          set -a; source versions.env; set +a
          for v in SOVEREIGN_VERSION PLANET_ZEROTIER_VERSION PLANET_ZEROTIER_SOURCE_REF CONTROLLER_ZEROTIER_VERSION CONTROLLER_ZEROTIER_SOURCE_REF MKWORLD_SOURCE_REF NODEJS_IMAGE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push native ${{ matrix.arch }} candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            SOVEREIGN_VERSION=${{ env.SOVEREIGN_VERSION }}
            PLANET_ZEROTIER_VERSION=${{ env.PLANET_ZEROTIER_VERSION }}
            PLANET_ZEROTIER_SOURCE_REF=${{ env.PLANET_ZEROTIER_SOURCE_REF }}
            CONTROLLER_ZEROTIER_VERSION=${{ env.CONTROLLER_ZEROTIER_VERSION }}
            CONTROLLER_ZEROTIER_SOURCE_REF=${{ env.CONTROLLER_ZEROTIER_SOURCE_REF }}
            MKWORLD_SOURCE_REF=${{ env.MKWORLD_SOURCE_REF }}
            NODEJS_IMAGE=${{ env.NODEJS_IMAGE }}
          tags: |
            ${{ steps.vars.outputs.image }}:candidate-${{ matrix.arch }}
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=sovereign-${{ matrix.arch }}-main
            type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=sovereign-${{ matrix.arch }}-main

  arm64-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare ARM64 runtime test environment
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:candidate-arm64"
          cp .env.example .env
          sed -i "s#^SOVEREIGN_IMAGE=.*#SOVEREIGN_IMAGE=$image#" .env
          sed -i 's/^PLANET_IP_ADDR4=.*/PLANET_IP_ADDR4=127.0.0.1/' .env
          rm -rf data
          mkdir -p data/planet/{one,world,dist,config} data/controller/one data/ztncui

      - name: Pull and start native ARM64 stack
        run: |
          docker compose pull sovereign
          docker compose up -d --no-build sovereign

      - name: ARM64 integration smoke test
        run: ./tests/integration/smoke.sh

      - name: ARM64 restart persistence test
        run: ./tests/integration/restart-persistence.sh

      - name: ARM64 logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=400 || true

      - name: ARM64 cleanup
        if: always()
        run: docker compose down -v || true

  manifest:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [build, arm64-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge native images into multi-arch candidate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${HEAD_SHA:0:12}"

          docker buildx imagetools create \
            --tag "$image:candidate" \
            "$image:candidate-amd64" \
            "$image:candidate-arm64"

          docker buildx imagetools create \
            --tag "$image:sha-$short_sha" \
            "$image:sha-$short_sha-amd64" \
            "$image:sha-$short_sha-arm64"

          docker buildx imagetools inspect "$image:candidate"
          docker buildx imagetools inspect "$image:sha-$short_sha"
