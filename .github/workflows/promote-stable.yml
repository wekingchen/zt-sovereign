name: Promote Stable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Already-published immutable release tag, e.g. v0.3.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact manifest to stable
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag='${{ inputs.release_tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          docker buildx imagetools inspect "$image:$tag" >/dev/null
          docker buildx imagetools create --tag "$image:stable" "$image:$tag"
          docker buildx imagetools inspect "$image:stable"
