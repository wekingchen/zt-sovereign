name: Promote Stable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Already-published immutable release tag, e.g. v0.4.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote exact manifest to stable
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_USERNAME,,}/zt-sovereign"
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "DOCKERHUB_USERNAME is empty" >&2; exit 1; }
          tag='${{ inputs.release_tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          docker buildx imagetools inspect "$image:$tag" >/dev/null
          docker buildx imagetools create --tag "$image:stable" "$image:$tag"
          docker buildx imagetools inspect "$image:stable"
