name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t files < <(find scripts tests rootfs/usr/local/bin -type f \( -name '*.sh' -o -perm -u+x \) ! -name '*.py' ! -name '*.js' -print)
          files+=(rootfs/usr/local/bin/sovereign-supervise)
          shellcheck "${files[@]}"
      - name: Runtime script syntax
        run: |
          python3 -m py_compile tests/unit/test_file_server.py
          node --check rootfs/usr/local/bin/file_server.js
          find ui/ztncui/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: ./tests/unit/run.sh
      - name: Ensure generated version fields are committed
        shell: bash
        run: |
          git diff --exit-code -- .env.example

  integration:
    needs: lint-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Load build pins and choose cache scope
        shell: bash
        run: |
          set -a; source versions.env; set +a
          for v in SOVEREIGN_VERSION PLANET_ZEROTIER_VERSION PLANET_ZEROTIER_SOURCE_REF CONTROLLER_ZEROTIER_VERSION CONTROLLER_ZEROTIER_SOURCE_REF ZTNET_VERSION ZTNET_SOURCE_REF ZTNET_NODE_IMAGE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "BUILD_CACHE_SCOPE=sovereign-amd64-main" >> "$GITHUB_ENV"
          else
            echo "BUILD_CACHE_SCOPE=sovereign-amd64-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          fi

      - name: Prepare CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^PLANET_IP_ADDR4=.*/PLANET_IP_ADDR4=127.0.0.1/' .env
          sed -i 's/^ZTNET_AUTH_SECRET=.*/ZTNET_AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password-do-not-use/' .env
          sed -i 's#^ZTNET_URL=.*#ZTNET_URL=http://127.0.0.1:3000#' .env

      - name: Build amd64 image with persistent BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: zerotier-sovereign:local
          build-args: |
            SOVEREIGN_VERSION=${{ env.SOVEREIGN_VERSION }}
            PLANET_ZEROTIER_VERSION=${{ env.PLANET_ZEROTIER_VERSION }}
            PLANET_ZEROTIER_SOURCE_REF=${{ env.PLANET_ZEROTIER_SOURCE_REF }}
            CONTROLLER_ZEROTIER_VERSION=${{ env.CONTROLLER_ZEROTIER_VERSION }}
            CONTROLLER_ZEROTIER_SOURCE_REF=${{ env.CONTROLLER_ZEROTIER_SOURCE_REF }}
            ZTNET_VERSION=${{ env.ZTNET_VERSION }}
            ZTNET_SOURCE_REF=${{ env.ZTNET_SOURCE_REF }}
            NEXT_PUBLIC_APP_VERSION=${{ env.ZTNET_VERSION }}
            NODEJS_IMAGE=${{ env.ZTNET_NODE_IMAGE }}
          cache-from: |
            type=gha,scope=sovereign-amd64-main
            type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

      - name: Report runtime image footprint
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(docker image inspect zerotier-sovereign:local --format '{{.Size}}')"
          mib="$(( (bytes + 1048575) / 1048576 ))"
          echo "Runtime image size: ${bytes} bytes (${mib} MiB)"
          report="$(mktemp)"
          {
            echo "### Runtime image footprint"
            echo
            echo "- Total uncompressed image size: **${mib} MiB** (${bytes} bytes)"
            echo
            echo '~~~text'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' zerotier-sovereign:local | head -n 20
            echo '~~~'
            echo
            echo '~~~text'
            docker run --rm --entrypoint /bin/bash zerotier-sovereign:local -lc '
              du -sh /app /app/node_modules /app/.next /opt/ztncui /opt/ztncui/node_modules /opt/zerotier-planet /opt/zerotier-controller /usr/local/lib/node_modules 2>/dev/null || true
              du -sh /usr/lib/postgresql* 2>/dev/null || true
              echo
              if command -v dpkg-query >/dev/null 2>&1; then
                dpkg-query -W -f="\${Installed-Size}\t\${Package}\n" 2>/dev/null | sort -nr | head -n 25
              elif command -v apk >/dev/null 2>&1; then
                apk info -v | sort | head -n 50
              fi
              echo
              echo "Prisma native engines:"
              find /app -type f \( -name "libquery_engine*" -o -name "query-engine*" -o -name "schema-engine*" \) 2>/dev/null |
                while IFS= read -r f; do stat -c "%s\t%n" "$f"; done |
                sort -nr || true
            '
            echo '~~~'
          } | tee "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$report"

      - name: Start stack
        run: docker compose up -d --no-build

      - name: Integration smoke test
        run: ./tests/integration/smoke.sh

      - name: Restart persistence test
        run: ./tests/integration/restart-persistence.sh

      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=400 || true

      - name: Cleanup
        if: always()
        run: docker compose down -v || true
