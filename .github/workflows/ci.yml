name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t files < <(find scripts tests rootfs/usr/local/bin -type f \( -name '*.sh' -o -perm -u+x \) ! -name '*.py' -print)
          shellcheck "${files[@]}"
      - name: Python syntax
        run: python3 -m py_compile rootfs/usr/local/bin/file_server.py tests/unit/test_file_server.py
      - name: Unit tests
        run: ./tests/unit/run.sh
      - name: Ensure generated version fields are committed
        shell: bash
        run: |
          git diff --exit-code -- .env.example

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^PLANET_IP_ADDR4=.*/PLANET_IP_ADDR4=127.0.0.1/' .env
          sed -i 's/^ZTNET_AUTH_SECRET=.*/ZTNET_AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password-do-not-use/' .env
          sed -i 's#^ZTNET_URL=.*#ZTNET_URL=http://127.0.0.1:3000#' .env
      - name: Build unified image from source
        run: ./scripts/build-local.sh
      - name: Start stack
        run: docker compose up -d --no-build
      - name: Integration smoke test
        run: ./tests/integration/smoke.sh
      - name: Restart persistence test
        run: ./tests/integration/restart-persistence.sh
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=400 || true
      - name: Cleanup
        if: always()
        run: docker compose down -v || true
