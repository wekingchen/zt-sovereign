name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        description: 'Existing release tag to publish, e.g. v0.4.2'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Validate release tag and prepare environment
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          set -a; source versions.env; set +a
          expected="v${SOVEREIGN_VERSION}"
          [[ "$RELEASE_TAG" == "$expected" ]] || {
            echo "Release tag $RELEASE_TAG does not match versions.env $expected" >&2
            exit 1
          }
          for v in SOVEREIGN_VERSION ZEROTIER_VERSION ZEROTIER_SOURCE_REF MKWORLD_SOURCE_REF NODEJS_IMAGE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          cp .env.example .env
          sed -i 's/^PLANET_IP_ADDR4=.*/PLANET_IP_ADDR4=127.0.0.1/' .env

      - name: Unit tests
        run: ./tests/unit/run.sh

      - name: Build cached amd64 verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: zerotier-sovereign:local
          build-args: |
            SOVEREIGN_VERSION=${{ env.SOVEREIGN_VERSION }}
            ZEROTIER_VERSION=${{ env.ZEROTIER_VERSION }}
            ZEROTIER_SOURCE_REF=${{ env.ZEROTIER_SOURCE_REF }}
            MKWORLD_SOURCE_REF=${{ env.MKWORLD_SOURCE_REF }}
            NODEJS_IMAGE=${{ env.NODEJS_IMAGE }}
          cache-from: |
            type=gha,scope=sovereign-amd64-main
            type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=sovereign-amd64-main

      - name: Integrated release smoke test
        shell: bash
        run: |
          docker compose up -d --no-build
          ./tests/integration/smoke.sh
          ./tests/integration/restart-persistence.sh

      - name: Stop local verification stack
        if: always()
        run: docker compose down -v || true

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load build pins
        id: vars
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -a; source versions.env; set +a
          for v in SOVEREIGN_VERSION ZEROTIER_VERSION ZEROTIER_SOURCE_REF MKWORLD_SOURCE_REF NODEJS_IMAGE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "DOCKERHUB_USERNAME is empty" >&2; exit 1; }
          echo "image=${DOCKERHUB_USERNAME,,}/zt-sovereign" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push native ${{ matrix.arch }} release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            SOVEREIGN_VERSION=${{ env.SOVEREIGN_VERSION }}
            ZEROTIER_VERSION=${{ env.ZEROTIER_VERSION }}
            ZEROTIER_SOURCE_REF=${{ env.ZEROTIER_SOURCE_REF }}
            MKWORLD_SOURCE_REF=${{ env.MKWORLD_SOURCE_REF }}
            NODEJS_IMAGE=${{ env.NODEJS_IMAGE }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ inputs.release_tag || github.ref_name }}-${{ matrix.arch }}
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=sovereign-${{ matrix.arch }}-main
            type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=sovereign-${{ matrix.arch }}-main

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge native release images into multi-arch manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_USERNAME,,}/zt-sovereign"
          short_sha=$(git rev-parse --short=12 HEAD)

          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "DOCKERHUB_USERNAME is empty" >&2; exit 1; }

          docker buildx imagetools create \
            --tag "$image:$RELEASE_TAG" \
            "$image:$RELEASE_TAG-amd64" \
            "$image:$RELEASE_TAG-arm64"

          docker buildx imagetools create \
            --tag "$image:sha-$short_sha" \
            "$image:sha-$short_sha-amd64" \
            "$image:sha-$short_sha-arm64"

          docker buildx imagetools create \
            --tag "$image:latest" \
            "$image:$RELEASE_TAG"

          docker buildx imagetools inspect "$image:$RELEASE_TAG"
          docker buildx imagetools inspect "$image:latest"
          docker buildx imagetools inspect "$image:sha-$short_sha"
