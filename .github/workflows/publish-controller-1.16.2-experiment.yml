name: Publish Controller 1.16.2 Experiment

on:
  push:
    branches: [controller-1.16.2-experiment]
    paths:
      - '.github/workflows/publish-controller-1.16.2-experiment.yml'

permissions:
  contents: read

concurrency:
  group: publish-controller-1.16.2-experiment
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller-1.16.2-experiment

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load build pins
        shell: bash
        run: |
          set -a; source versions.env; set +a
          for v in SOVEREIGN_VERSION PLANET_ZEROTIER_VERSION PLANET_ZEROTIER_SOURCE_REF CONTROLLER_ZEROTIER_VERSION CONTROLLER_ZEROTIER_SOURCE_REF MKWORLD_SOURCE_REF NODEJS_IMAGE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Build and push experimental ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            SOVEREIGN_VERSION=${{ env.SOVEREIGN_VERSION }}
            PLANET_ZEROTIER_VERSION=${{ env.PLANET_ZEROTIER_VERSION }}
            PLANET_ZEROTIER_SOURCE_REF=${{ env.PLANET_ZEROTIER_SOURCE_REF }}
            CONTROLLER_ZEROTIER_VERSION=${{ env.CONTROLLER_ZEROTIER_VERSION }}
            CONTROLLER_ZEROTIER_SOURCE_REF=${{ env.CONTROLLER_ZEROTIER_SOURCE_REF }}
            MKWORLD_SOURCE_REF=${{ env.MKWORLD_SOURCE_REF }}
            NODEJS_IMAGE=${{ env.NODEJS_IMAGE }}
          tags: |
            goordonchen/zt-sovereign:controller-1.16.2-experiment-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=sovereign-${{ matrix.arch }}-main
            type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=controller-1.16.2-experiment-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch experiment manifest
        shell: bash
        run: |
          set -euo pipefail
          image="goordonchen/zt-sovereign"
          tag="controller-1.16.2-experiment"

          docker buildx imagetools create \
            --tag "$image:$tag" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"

          docker buildx imagetools inspect "$image:$tag"
